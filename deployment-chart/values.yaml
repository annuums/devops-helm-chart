fullnameOverride: annuums-deployment
appVersionSuffix: deployment-chart
namespace: annuums-deployment

serviceAccount:
  create: false

labels: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

targetGroupBinding: {}

terminationGracePeriodSeconds: 30

autoscaling:
  enabled: false
  hpa: {}
  keda: {}

# -- Pod-level securityContext.
# Supports runAsNonRoot, runAsUser, runAsGroup, fsGroup, fsGroupChangePolicy,
# supplementalGroups, seccompProfile. Any other key fails at render time.
# Container-level securityContext is set per entry in containers/initContainers.
securityContext: {}

# -- Container-level securityContext applied to every container and init
# container. Set it once here instead of repeating the same block in every
# `containers[]` entry of every env values file — Helm replaces lists instead of
# merging them, so a container-level default cannot live in `containers[]`.
# Accepts the same keys as `containers[].securityContext`; a key set on a
# container overrides the default for that container (per top-level key, so a
# container that sets `capabilities` replaces the default `capabilities` whole).
defaultContainerSecurityContext: {}

# `hostUsers` is intentionally absent: the chart only renders it when the key is
# present in values, so declaring it here would pin every release to a value
# instead of leaving the Kubernetes default (true).

# -- `containers[].pdb` renders a PodDisruptionBudget for that container.
# Set only one of `minAvailable` / `maxUnavailable`; setting both fails at render time.
# `0` is a valid value for either field; omit the key entirely to leave it unset.
initContainers: []
containers: []

replicas: 1
revisionHistoryLimit: 3

nodeSelector: {}

ports: []

startProbe: {}
readinessProbe: {}
livenessProbe: {}

volumeMounts: []
volumes: []
affinity: {}
tolerations: []

{{- with .Values.containers }}
  {{- range . }}
  {{- if and .pdb .pdb.enabled }}
  {{/* Presence, not truthiness: 0 is a valid value for both fields. */}}
  {{- $hasMaxUnavailable := and (hasKey .pdb "maxUnavailable") (not (kindIs "invalid" .pdb.maxUnavailable)) }}
  {{- $hasMinAvailable := and (hasKey .pdb "minAvailable") (not (kindIs "invalid" .pdb.minAvailable)) }}

  {{- if $hasMaxUnavailable }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .name }}-pdb-max-unavailable
  namespace: {{ template "annuums-deployment.namespace" $ }}
spec:
  maxUnavailable: {{ .pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- if $.Values.serviceSelector }}
      {{- toYaml $.Values.serviceSelector | nindent 6 }}
      {{- else }}
      annuums.devops/name: {{ include "annuums-deployment.fullname" $ }}-selector
      {{- end }}
  {{- end }}

  {{- if $hasMinAvailable }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .name }}-pdb-min-available
  namespace: {{ template "annuums-deployment.namespace" $ }}
spec:
  minAvailable: {{ .pdb.minAvailable }}
  selector:
    matchLabels:
      {{- if $.Values.serviceSelector }}
      {{- toYaml $.Values.serviceSelector | nindent 6 }}
      {{- else }}
      annuums.devops/name: {{ include "annuums-deployment.fullname" $ }}-selector
      {{- end }}
  {{- end }}
  
  {{- end }}
  {{- end }}
  {{- end }}

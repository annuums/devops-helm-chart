---
# Unique Name Check Passed {{- include "job.checkUniqueContainerNames" . }}
# Check job spec Passed {{- include "validate.job" . }}
# Check init container lifecycle Passed {{- include "validate.initContainerLifecycle" . }}
# Check hostUsers Passed {{- include "validate.hostUsers" . }}
# Check securityContext Passed {{- include "validate.securityContext" . }}
# Check volumes Passed {{- include "validate.volumes" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "annuums-job.fullname" . }}
  namespace: {{ template "annuums-job.namespace" . }}
  {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/job: {{ template "annuums-job.fullname" . }}
    annuums.obs/version: {{ template "annuums-job.chart" . }}
    {{- include "annuums-job.labels" . | nindent 4 }}
    {{- if .Values.labels }}
    {{- toYaml .Values.labels | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ default 0 .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ default 600 .Values.job.activeDeadlineSeconds }}
  {{- if not (kindIs "invalid" .Values.job.ttlSecondsAfterFinished) }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.job.completions) }}
  completions: {{ .Values.job.completions }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.job.parallelism) }}
  parallelism: {{ .Values.job.parallelism }}
  {{- end }}
  {{- if .Values.job.completionMode }}
  completionMode: {{ .Values.job.completionMode }}
  {{- end }}
  {{- if hasKey .Values.job "suspend" }}
  suspend: {{ .Values.job.suspend }}
  {{- end }}
  template:
    metadata:
      {{- if .Values.podAnnotations }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/job: {{ template "annuums-job.fullname" $ }}
        annuums.obs/version: {{ template "annuums-job.chart" $ }}
        {{- include "annuums-job.labels" $ | nindent 8 }}
        {{- if .Values.labels }}
        {{- toYaml .Values.labels | nindent 8 }}
        {{- end }}
    spec:
      hostNetwork: {{ default false .Values.job.hostNetwork }}
      {{- if hasKey .Values.job "hostUsers" }}
      hostUsers: {{ .Values.job.hostUsers }}
      {{- end }}
      {{- if .Values.job.securityContext }}
      {{- include "annuums-job.podSecurityContext" .Values.job.securityContext | nindent 6 }}
      {{- end }}
      restartPolicy: {{ default "Never" .Values.job.restartPolicy }}
      {{- if and (.Values.serviceAccount) (or (.Values.serviceAccount.create) (.Values.serviceAccount.exist)) }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- with .Values.tolerations }}
        {{- range . }}
        - key: {{ .key }}
          value: {{ .value | quote }}
          operator: {{ .operator }}
          effect: {{ .effect }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- range . }}
        - name: {{ .name }}
          image: {{ printf "%s:%v" .image.repository .image.tag | quote }}
          imagePullPolicy: {{ default "IfNotPresent" .image.pullPolicy }}
          {{- if .restartPolicy }}
          restartPolicy: {{ .restartPolicy }}
          {{- end }}
          {{- if .lifecycle }}
          {{- include "annuums-job.lifecycle" (dict "name" (printf "initContainers[%s]" .name) "lifecycle" .lifecycle) | nindent 10 }}
          {{- end }}
          {{- $securityContext := include "annuums-job.effectiveContainerSecurityContext" (dict "name" (printf "initContainers[%s]" .name) "default" $.Values.defaultContainerSecurityContext "securityContext" .securityContext) }}
          {{- if $securityContext }}
          {{- $securityContext | nindent 10 }}
          {{- end }}
          {{- if .command }}
          command:
            {{- toYaml .command | nindent 12 }}
          {{- end }}
          {{- if .args }}
          args:
            {{- toYaml .args | nindent 12 }}
          {{- end }}
          {{- with $.Values.environment }}
          {{- if or .env .secret .configmap }}
          env:
            {{- if .env }}
              {{- toYaml .env | nindent 12 }}
            {{- end }}
            {{- if .secret }}
            {{- range .secret }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .ref.name }}
                  key: {{ .ref.key }}
                  optional: {{ .ref.optional }}
            {{- end }}
            {{- end }}
            {{- if .configmap }}
            {{- range .configmap }}
            - name: {{ .name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ .ref.name }}
                  key: {{ .ref.key }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if .envFrom }}
          envFrom:
          {{- range .envFrom }}
            {{- if eq .type "configmap" }}
            - configMapRef:
                name: {{ .configMapRefName }}
            {{- end }}
            {{- if eq .type "secret" }}
            - secretRef:
                name: {{ .secretRefName }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with .volumeMounts }}
          volumeMounts:
          {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              subPath: {{ .subPath }}
              readOnly: {{ .readOnly }}
          {{- end }}
          {{- end }}
          resources:
          {{- if .resources }}
            requests:
              cpu: {{ .resources.cpu }}
              memory: {{ .resources.memory }}
            limits:
              cpu: {{ .resources.cpu }}
              memory: {{ .resources.memory }}
          {{- else }}
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
      {{- with .Values.job.containers }}
        {{- range $index, $container := . }}
        - name: {{ $container.name }}{{ if $.Values.job.name }} # {{ printf "%s-%d" $.Values.job.name $index }}{{ end }}
          image: {{ printf "%s:%v" $container.image.repository $container.image.tag | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $container.image.pullPolicy }}
          {{- if $container.lifecycle }}
          {{- include "annuums-job.lifecycle" (dict "name" (printf "job.containers[%s]" $container.name) "lifecycle" $container.lifecycle) | nindent 10 }}
          {{- end }}
          {{- $securityContext := include "annuums-job.effectiveContainerSecurityContext" (dict "name" (printf "job.containers[%s]" $container.name) "default" $.Values.defaultContainerSecurityContext "securityContext" $container.securityContext) }}
          {{- if $securityContext }}
          {{- $securityContext | nindent 10 }}
          {{- end }}
          {{- with $.Values.environment }}
          {{- if or .env .secret .configmap }}
          env:
            {{- if .env }}
              {{- toYaml .env | nindent 12 }}
            {{- end }}
            {{- if .secret }}
            {{- range .secret }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .ref.name }}
                  key: {{ .ref.key }}
                  optional: {{ .ref.optional }}
            {{- end }}
            {{- end }}
            {{- if .configmap }}
            {{- range .configmap }}
            - name: {{ .name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ .ref.name }}
                  key: {{ .ref.key }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- if .envFrom }}
          envFrom:
          {{- range .envFrom }}
            {{- if eq .type "configmap" }}
            - configMapRef:
                name: {{ .configMapRefName }}
            {{- end }}
            {{- if eq .type "secret" }}
            - secretRef:
                name: {{ .secretRefName }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if $container.command }}
          command:
            {{- toYaml $container.command | nindent 12 }}
          {{- end }}
          {{- if $container.args }}
          args:
            {{- toYaml $container.args | nindent 12 }}
          {{- end }}
          {{- with $container.volumeMounts }}
          volumeMounts:
          {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              subPath: {{ .subPath }}
              readOnly: {{ .readOnly }}
          {{- end }}
          {{- end }}
          resources:
          {{- if $container.resources }}
            requests:
              cpu: {{ $container.resources.cpu }}
              memory: {{ $container.resources.memory }}
            limits:
              cpu: {{ $container.resources.cpu }}
              memory: {{ $container.resources.memory }}
          {{- else }}
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- range . }}
        - name: {{ .name }}
          {{- if .hostPath }}
          hostPath:
            path: {{ .hostPath.path }}
            type: {{ .hostPath.type }}
          {{- end }}
          {{- if hasKey . "emptyDir" }}
          {{- include "annuums-job.emptyDirVolume" (dict "name" .name "emptyDir" .emptyDir) | nindent 10 }}
          {{- end }}
          {{- if .secretVolume }}
          secret:
            secretName: {{ .secretVolume.secretName }}
          {{- end }}
          {{- if .configMapVolume }}
          configMap:
            name: {{ .configMapVolume.name }}
          {{- end }}
          {{- if .persistentVolumeClaim }}
          persistentVolumeClaim:
            claimName: {{ .persistentVolumeClaim.name }}
          {{- end }}
        {{- end }}
      {{- end }}

fullnameOverride: annuums-rollout
appVersionSuffix: rollout-chart

serviceAccount:
  create: false

labels: {}

# -- strategy.type: canary | blueGreen
strategy:
  type: canary

  canary:
    # canaryService: ""
    # stableService: ""
    maxSurge: "25%"
    maxUnavailable: 0
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
    # trafficRouting:
    #   plugins:
    #     argoproj-labs/gatewayAPI:
    #       httpRoute: my-http-route
    #       namespace: my-namespace
    # analysis:
    #   templates:
    #     - templateName: success-rate
    #   startingStep: 2
    #   args:
    #     - name: service-name
    #       value: my-service

  blueGreen:
    activeService: ""
    # previewService: ""
    autoPromotionEnabled: false
    # autoPromotionSeconds: 30
    # scaleDownDelaySeconds: 30
    # prePromotionAnalysis:
    #   templates:
    #     - templateName: success-rate
    #   args:
    #     - name: service-name
    #       value: my-service
    # postPromotionAnalysis:
    #   templates:
    #     - templateName: success-rate

autoscaling:
  enabled: false
  hpa: {}
  keda: {}

replicas: 1
revisionHistoryLimit: 3

terminationGracePeriodSeconds: 30

# -- Pod-level securityContext.
# Supports runAsNonRoot, runAsUser, runAsGroup, fsGroup, fsGroupChangePolicy,
# supplementalGroups, seccompProfile. Any other key fails at render time.
# Container-level securityContext is set per entry in containers/initContainers.
securityContext: {}

# `hostUsers` is intentionally absent: the chart only renders it when the key is
# present in values, so declaring it here would pin every release to a value
# instead of leaving the Kubernetes default (true).

# -- `containers[].pdb` renders a PodDisruptionBudget for that container.
# Set only one of `minAvailable` / `maxUnavailable`; setting both fails at render time.
initContainers: []
containers: []

nodeSelector: {}

startupProbe: {}
readinessProbe: {}
livenessProbe: {}

volumeMounts: []
volumes: []
affinity: {}
tolerations: []
